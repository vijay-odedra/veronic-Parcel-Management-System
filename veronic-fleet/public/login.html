<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>DropBook | Fleet & Parcel Access</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Firebase SDKs (Non-blocking background load) -->
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-client.js"></script>
  <style>
    :root {
      --primary: #084c50;
      --primary-dark: #052a2d;
      --primary-light: #0d6b70;
      --accent-mint: #e6f4f2;
      --text-dark: #082c2e;
      --text-muted: #64748b;
      --border-color: #dce8e8;
      --card-bg: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #052a2d 0%, #084c50 50%, #0d6b70 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      color: var(--text-dark);
    }

    .login-wrapper {
      max-width: 420px;
      width: 100%;
      position: relative;
    }

    /* Floating Round Logo Badge */
    .avatar-floating-badge {
      width: 96px;
      height: 96px;
      background: #ffffff;
      border: 4px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: -48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      padding: 0;
    }

    .avatar-floating-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      border-radius: 28px;
      box-shadow: 0 25px 55px -10px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 56px 32px 32px;
      position: relative;
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .card-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .card-header p {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Tabs for Sign In & Sign Up */
    .auth-tab-row {
      display: flex;
      background: #f1f6f6;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 22px;
      border: 1px solid #dce8e8;
    }

    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      font-weight: 700;
      font-size: 0.85rem;
      background: transparent;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .auth-tab-btn.active {
      background: #084c50;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(8, 76, 80, 0.2);
    }

    /* Input Field Container with Connected Left Icon (Matching reference image) */
    .input-box-row {
      display: flex;
      align-items: stretch;
      background: #ffffff;
      border: 1.5px solid #dce8e8;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-box-row:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(8, 76, 80, 0.12);
    }

    .input-icon-cell {
      background: #084c50;
      color: #ffffff;
      width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .input-box-row input {
      flex: 1;
      border: none;
      outline: none;
      padding: 13px 14px;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-dark);
      background: transparent;
    }

    .input-box-row input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .toggle-pwd-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 0.95rem;
      padding: 0 14px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-pwd-btn:hover {
      color: var(--primary);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 20px;
      font-size: 0.82rem;
    }

    .remember-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #475569;
      cursor: pointer;
      font-weight: 600;
    }

    .remember-cell input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link, .switch-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .forgot-link:hover, .switch-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* Floating Pill Button */
    .submit-pill-btn {
      background: #084c50;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      box-shadow: 0 8px 22px rgba(8, 76, 80, 0.35);
    }

    .submit-pill-btn:hover {
      background: #052a2d;
      box-shadow: 0 10px 26px rgba(8, 76, 80, 0.45);
    }

    .submit-pill-btn:active {
      transform: scale(0.99);
    }

    .message-area {
      margin-top: 14px;
      font-size: 0.82rem;
      padding: 9px 12px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .error-msg {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fee2e2;
    }

    .success-msg {
      color: #047857;
      background: #e6f7ef;
      border: 1px solid #cceee0;
    }

    .info-msg {
      color: var(--primary);
      background: var(--accent-mint);
      border: 1px solid #d4ece8;
    }

    .demo-bar {
      margin-top: 18px;
      background: #f4f8f8;
      border: 1px dashed #bcd5d5;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-dark);
    }

    .demo-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      transition: background 0.2s;
    }

    .demo-btn:hover {
      background: var(--accent-mint);
    }

    .form-panel {
      display: none;
    }

    .form-panel.active-panel {
      display: block;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <!-- Floating Round Logo Badge -->
  <div class="avatar-floating-badge" style="background:#ffffff; border:4px solid #ffffff; border-radius:50%; overflow:hidden;">
    <img src="images/logo.png" alt="DropBook" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">
  </div>

  <div class="card">
    <div class="card-header">
      <h1 style="font-size:1.65rem; font-weight:800; color:var(--primary); margin-bottom:4px;">DropBook</h1>
      <p>Fleet & Parcel Management Portal</p>
    </div>

    <!-- Toggle Tabs -->
    <div class="auth-tab-row">
      <button class="auth-tab-btn active" id="loginTabBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
      <button class="auth-tab-btn" id="signupTabBtn"><i class="fas fa-user-plus"></i> Sign Up</button>
    </div>

    <!-- SIGN IN PANEL -->
    <div id="loginPanel" class="form-panel active-panel">
      <form id="loginFormElement" autocomplete="off">
        <!-- Email / Username Input with Dark Connected Prefix -->
        <div class="input-box-row">
          <div class="input-icon-cell"><i class="fas fa-user"></i></div>
          <input type="text" id="loginEmail" placeholder="Enter Username or Email" autocomplete="off" value="" required>
        </div>

        <!-- Password Input with Dark Connected Prefix -->
        <div class="input-box-row">
          <div class="input-icon-cell"><i class="fas fa-lock"></i></div>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="new-password" value="" required>
          <button type="button" class="toggle-pwd-btn" data-target="loginPassword" aria-label="Toggle password visibility">
            <svg class="eye-show-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-hide-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>

        <div class="form-options">
          <label class="remember-cell">
            <input type="checkbox" id="loginRemember" checked> Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <button type="submit" class="submit-pill-btn" id="loginSubmitBtn">
          <span>Login</span>
        </button>
      </form>

      <div style="text-align:center; margin-top:20px; font-size:0.82rem; color:#64748b;">
        Don't have an account? <a href="#" class="switch-link" id="switchToSignupLink">Sign Up</a>
      </div>
    </div>

    <!-- SIGN UP PANEL -->
    <div id="signupPanel" class="form-panel">
      <form id="signupFormElement">
        <div class="input-box-row">
          <div class="input-icon-cell"><i class="fas fa-user-tag"></i></div>
          <input type="text" id="signupName" placeholder="Full Name" autocomplete="name" required>
        </div>

        <div class="input-box-row">
          <div class="input-icon-cell"><i class="fas fa-envelope"></i></div>
          <input type="email" id="signupEmail" placeholder="Email ID" autocomplete="email" required>
        </div>

        <div class="input-box-row">
          <div class="input-icon-cell"><i class="fas fa-lock"></i></div>
          <input type="password" id="signupPassword" placeholder="Password (min 3 chars)" autocomplete="new-password" required>
          <button type="button" class="toggle-pwd-btn" data-target="signupPassword" aria-label="Toggle password visibility">
            <svg class="eye-show-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-hide-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>

        <div class="input-box-row">
          <div class="input-icon-cell"><i class="fas fa-shield-alt"></i></div>
          <input type="password" id="signupConfirm" placeholder="Confirm Password" autocomplete="new-password" required>
          <button type="button" class="toggle-pwd-btn" data-target="signupConfirm" aria-label="Toggle password visibility">
            <svg class="eye-show-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-hide-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>

        <button type="submit" class="submit-pill-btn" id="signupSubmitBtn" style="margin-top:12px;">
          <span>Create Account</span>
        </button>
      </form>

      <div style="text-align:center; margin-top:16px; font-size:0.82rem; color:#64748b;">
        Already have an account? <a href="#" class="switch-link" id="switchToLoginLink">Login</a>
      </div>
    </div>

    <div id="msgBox" class="message-area" style="display:none;"></div>
  </div>
</div>

<script>
  const API_URL = `${window.location.origin}/api`;
  const AUTH_KEY = 'veronic_auth_token';

  function setAuthToken(token) { localStorage.setItem(AUTH_KEY, token); }
  function getAuthToken() { return localStorage.getItem(AUTH_KEY); }

  const loginTabBtn = document.getElementById('loginTabBtn');
  const signupTabBtn = document.getElementById('signupTabBtn');
  const loginPanel = document.getElementById('loginPanel');
  const signupPanel = document.getElementById('signupPanel');
  const msgBox = document.getElementById('msgBox');

  function showMessage(text, type = 'error') {
    msgBox.style.display = 'flex';
    msgBox.className = 'message-area ' + (type === 'error' ? 'error-msg' : (type === 'success' ? 'success-msg' : 'info-msg'));
    msgBox.innerHTML = (type === 'error' ? '<i class="fas fa-exclamation-circle"></i> ' : (type === 'success' ? '<i class="fas fa-check-circle"></i> ' : '<i class="fas fa-info-circle"></i> ')) + text;
  }

  function hideMessage() { msgBox.style.display = 'none'; }

  function switchTab(mode) {
    hideMessage();
    if (mode === 'login') {
      loginTabBtn.classList.add('active');
      signupTabBtn.classList.remove('active');
      loginPanel.classList.add('active-panel');
      signupPanel.classList.remove('active-panel');
    } else {
      signupTabBtn.classList.add('active');
      loginTabBtn.classList.remove('active');
      signupPanel.classList.add('active-panel');
      loginPanel.classList.remove('active-panel');
    }
  }

  loginTabBtn.addEventListener('click', () => switchTab('login'));
  signupTabBtn.addEventListener('click', () => switchTab('signup'));
  document.getElementById('switchToSignupLink')?.addEventListener('click', (e) => { e.preventDefault(); switchTab('signup'); });
  document.getElementById('switchToLoginLink')?.addEventListener('click', (e) => { e.preventDefault(); switchTab('login'); });

  document.querySelectorAll('.toggle-pwd-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('data-target');
      const input = document.getElementById(targetId);
      if (!input) return;
      const showSvg = this.querySelector('.eye-show-icon');
      const hideSvg = this.querySelector('.eye-hide-icon');
      if (input.type === 'password') {
        input.type = 'text';
        if (showSvg && hideSvg) {
          showSvg.style.display = 'block';
          hideSvg.style.display = 'none';
        }
      } else {
        input.type = 'password';
        if (showSvg && hideSvg) {
          showSvg.style.display = 'none';
          hideSvg.style.display = 'block';
        }
      }
    });
  });

  document.getElementById('fillDemoBtn')?.addEventListener('click', () => {
    document.getElementById('loginEmail').value = 'admin@veronic.com';
    document.getElementById('loginPassword').value = 'admin123';
    showMessage('Demo credentials auto-filled! Click Login to proceed.', 'info');
  });

  function fillQuickDemo(email, pwd) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = pwd;
    showMessage(`Credentials filled for ${email}. Click Login to enter!`, 'info');
  }

  document.getElementById('forgotPasswordLink')?.addEventListener('click', (e) => {
    e.preventDefault();
    showMessage('Default Main Admin: mainadmin@veronic.com / admin123 | Sub-Admin: rajkotadmin@veronic.com / admin123', 'info');
  });

  document.getElementById('loginFormElement')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessage();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginSubmitBtn');

    if (!email || !password) { showMessage('Please enter both email/username and password.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

    try {
      const response = await fetch(`${API_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();

      if (data.success && data.data && data.data.token) {
        setAuthToken(data.data.token);
        if (data.data.token.startsWith('adm_')) {
          localStorage.setItem('veronic_admin_token', data.data.token);
        }
        if (data.data.user) {
          localStorage.setItem('veronic_user', JSON.stringify(data.data.user));
        }

        const roleText = data.data.role === 'main_admin' ? 'Super Admin' : (data.data.role === 'sub_admin' ? 'Office Admin' : 'User');
        showMessage(`Welcome back! Authenticated as ${roleText}. Redirecting...`, 'success');

        let targetUrl = data.data.redirectTo || 'index.html';
        if (targetUrl.startsWith('/')) targetUrl = targetUrl.substring(1);
        setTimeout(() => { window.location.href = targetUrl; }, 600);
      } else {
        showMessage(data.message || data.error || 'Invalid credentials. Please check your username/email and password.');
        btn.disabled = false;
        btn.innerHTML = '<span>Login</span>';
      }
    } catch (err) {
      console.error('Login error:', err);
      showMessage('Cannot connect to server. Please ensure the server is active.');
      btn.disabled = false;
      btn.innerHTML = '<span>Login</span>';
    }
  });

  document.getElementById('signupFormElement')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessage();
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirm').value;
    const btn = document.getElementById('signupSubmitBtn');

    if (!name || !email || !password) { showMessage('Please complete all required fields.'); return; }
    if (password !== confirm) { showMessage('Passwords do not match. Please verify.'); return; }
    if (password.length < 3) { showMessage('Password must be at least 3 characters.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

    try {
      const response = await fetch(`${API_URL}/signup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await response.json();

      if (data.success && data.data && data.data.token) {
        setAuthToken(data.data.token);
        showMessage('Account created successfully! Redirecting to dashboard...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      } else {
        showMessage(data.error || 'Failed to create account.');
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account</span>';
      }
    } catch (err) {
      console.error('Signup error:', err);
      showMessage('Cannot connect to server.');
      btn.disabled = false;
      btn.innerHTML = '<span>Create Account</span>';
    }
  });

  // Clear inputs on load to show clean placeholders (no auto-bypass)
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const em = document.getElementById('loginEmail');
      const pw = document.getElementById('loginPassword');
      if (em) em.value = '';
      if (pw) pw.value = '';
    }, 60);
  });
</script>

</body>
</html>
